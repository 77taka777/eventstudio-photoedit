<h1>チェックリスト</h1>
<p class="lead">前日の準備から撤収まで、確認することをリストに。最初からイベント向けの項目が入っているので、自分の現場に合わせて書き換えてください。</p>

<div class="runbar no-print"><button type="button" id="addList">＋ リストを追加</button></div>
<p class="fine no-print">チェックと項目はこのブラウザの中に自動で保存されます。次のイベントでは「チェックをすべて外す」で同じリストを使い回せます。</p>
